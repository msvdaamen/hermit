name: CI

on:
  push:
    branches: [main]
    paths-ignore: &docs-only
      - "**.md"
      - ".agents/**"
      - ".claude/**"
      - "skills-lock.json"
      - "assets/icon.svg"
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

permissions:
  contents: read

# A new push to a branch or PR cancels its run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts never get reused in CI and only bloat the cache.
  CARGO_INCREMENTAL: 0
  # Debug info is not needed in CI. Leaving it out makes compiling and linking
  # faster and the cached target directory much smaller.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: -D warnings
  # System libraries GPUI and its font stack need on the Ubuntu runner.
  LINUX_DEPS: >-
    pkg-config
    libfontconfig-dev
    libfreetype-dev
    libwayland-dev
    libxkbcommon-dev
    libxkbcommon-x11-dev
    libvulkan-dev

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ env.LINUX_DEPS }}
          version: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          # Only main writes caches; PRs restore main's. This keeps PR runs
          # from evicting main's caches out of the 10 GB repo limit.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: ${{ env.LINUX_DEPS }}
          version: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Build tests
        run: cargo test --all-targets --locked --no-run
      - name: Run tests
        run: cargo test --all-targets --locked
