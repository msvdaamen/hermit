[package]
name = "hermit"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
dotenvy = "0.15.7"
futures = "0.3.34"
gpui-kit = { version = "0.11.0", default-features = false, features = ["component", "assets", "gpui-fast"] }
opentelemetry = "0.33.1"
opentelemetry-appender-tracing = "0.33.1"
# OTLP over HTTP/protobuf with a blocking client: no async runtime needed. rustls for HTTPS endpoints.
opentelemetry-otlp = { version = "0.33.1", features = ["reqwest-rustls"] }
opentelemetry_sdk = "0.33.1"
png = "0.18"
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
ksni = { version = "0.3", default-features = false, features = ["async-io"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
global-hotkey = "0.10.0"
tray-icon = "0.27"
